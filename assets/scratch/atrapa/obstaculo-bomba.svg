<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90">
  <defs>
    <radialGradient id="bombGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>

  <!-- Picos / Sensores de advertencia -->
  <polygon points="45,4 40,16 50,16" fill="#f43f5e"/>
  <polygon points="45,86 40,74 50,74" fill="#f43f5e"/>
  <polygon points="4,45 16,40 16,50" fill="#f43f5e"/>
  <polygon points="86,45 74,40 74,50" fill="#f43f5e"/>
  <polygon points="16,16 26,22 22,26" fill="#f43f5e"/>
  <polygon points="74,16 68,26 64,22" fill="#f43f5e"/>
  <polygon points="16,74 22,64 26,68" fill="#f43f5e"/>
  <polygon points="74,74 64,68 68,64" fill="#f43f5e"/>

  <!-- Esfera principal -->
  <circle cx="45" cy="45" r="30" fill="url(#bombGrad)" stroke="#f43f5e" stroke-width="2.5"/>

  <!-- Indicador de peligro central -->
  <circle cx="45" cy="45" r="14" fill="#f43f5e" opacity="0.2"/>
  <text x="45" y="52" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#f43f5e" text-anchor="middle">⚠️</text>

  <!-- Reflejo esférico -->
  <ellipse cx="36" cy="34" rx="8" ry="5" fill="#ffffff" opacity="0.3" transform="rotate(-30 36 34)"/>
